name: Go CI

on:
  push:
    branches:
      - main
      - feature/profile-avatar-editor
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d agentic_ai_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SKILLS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentic_ai_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build packages
        run: go build ./...

      # Known vulnerabilities in Go and in the modules the code actually calls.
      # A new advisory fails the build so it is seen the day it is published.
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
